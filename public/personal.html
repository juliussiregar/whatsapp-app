<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pribadi — WhatsApp Dashboard</title>
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__logo">WA</span>
          <div>
            <h1>Chat Pribadi</h1>
            <p>Pesan satu lawan bicara</p>
          </div>
        </div>
        <div class="topbar__actions">
          <span id="status-badge" class="badge">Memuat…</span>
          <button id="btn-reconnect" type="button" class="btn btn--sm btn--ghost" hidden>Reconnect</button>
          <button id="btn-logout" type="button" class="btn btn--sm btn--danger" hidden>Logout</button>
        </div>
      </header>

      <div class="shell">
        <nav class="sidebar-nav" aria-label="Menu utama">
          <p class="sidebar-nav__label">Menu</p>
          <a href="/app" class="sidebar-nav__link"><span class="sidebar-nav__icon">⚡</span> Koneksi</a>
          <a href="/app/groups" class="sidebar-nav__link"><span class="sidebar-nav__icon">👥</span> Grup</a>
          <a href="/app/personal" class="sidebar-nav__link sidebar-nav__link--active"><span class="sidebar-nav__icon">💬</span> Pribadi</a>
          <a href="/app/send" class="sidebar-nav__link"><span class="sidebar-nav__icon">✉️</span> Kirim cepat</a>
          <div class="sidebar-nav__divider"></div>
          <details class="sidebar-nav__status">
            <summary>Status</summary>
            <dl class="meta meta--compact">
              <div><dt>State</dt><dd id="meta-state">—</dd></div>
            </dl>
          </details>
        </nav>

        <main class="page-main page-main--chat">
          <div id="chat-workspace" class="workspace">
            <aside class="sidebar">
              <div class="sidebar__head">
                <h2>Daftar chat <span id="chats-count" class="count"></span></h2>
                <button type="button" id="btn-refresh-chats" class="btn btn--icon" title="Muat ulang">↻</button>
              </div>
              <input type="search" id="search-chats" class="search" placeholder="Cari nama atau nomor…" />
              <ul id="list-chats" class="chat-list"></ul>
            </aside>
            <div class="chat-pane">
              <header class="chat-pane__head">
                <button type="button" id="btn-chat-back" class="btn btn--icon btn--back-mobile" aria-label="Kembali ke daftar">←</button>
                <div class="chat-pane__title-wrap">
                  <span id="personal-avatar" class="avatar" hidden>?</span>
                  <div>
                    <h3 id="personal-chat-title">Pilih chat</h3>
                    <p id="personal-chat-meta" class="hint hint--sm">Pilih chat di kiri untuk melihat pesan</p>
                    <span id="live-indicator" class="live-indicator" hidden title="Pesan diperbarui otomatis setiap 10 detik">● Live</span>
                  </div>
                </div>
                <button type="button" id="btn-refresh-personal-msgs" class="btn btn--icon btn--light" title="Muat ulang pesan" disabled>↻</button>
              </header>
              <div class="messages-wrap">
                <div id="personal-messages" class="messages">
                  <p class="messages__empty">Pilih chat untuk melihat pesan</p>
                </div>
                <button type="button" id="btn-scroll-bottom" class="btn-scroll-bottom" hidden aria-label="Ke pesan terbaru">↓ Terbaru</button>
              </div>
              <div class="chat-pane__footer">
                <form id="form-personal-send" class="composer">
                  <textarea id="input-personal-msg" rows="2" placeholder="Tulis pesan…" disabled></textarea>
                  <button type="submit" class="btn btn--primary" id="btn-personal-send" disabled>Kirim</button>
                </form>
                <p class="composer-hint">Enter kirim · Shift+Enter baris baru</p>
                <p id="personal-feedback" class="feedback" hidden></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/app/personal.js"></script>
  </body>
</html>

services:
  solidpace-bot:
    build: .
    container_name: solidpace-bot
    ports:
      - "3044:3044"
    environment:
      - PORT=3044
      - NODE_ENV=production
      - BROWSER_PATH=/usr/bin/chromium
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    env_file:
      - .env
    volumes:
      - solidpace-session:/app/.wwebjs_auth
      - solidpace-cache:/app/.wwebjs_cache
    restart: unless-stopped

volumes:
  solidpace-session:
  solidpace-cache:
